name: scraper-service CI

on:
  workflow_dispatch:
  pull_request:
    paths: ["services/scraper-service/**"]
  push:
    branches: [dev, main]
    paths: ["services/scraper-service/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/scraper-service/requirements.txt
      - name: Run tests
        working-directory: services/scraper-service
        env:
          REDIS_URL: redis://localhost:6380/1
          RABBITMQ_URL: amqp://guest:guest@localhost:5673/
          MONGO_URL: mongodb://localhost:27018
          MONGO_DB_NAME: scraper
        run: pytest tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image owner
        id: prep
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/scraper-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/scraper-service:${{ github.sha }}