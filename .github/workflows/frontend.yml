name: frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [dev, main]
    paths: ["frontend/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run test
      - run: npm run build