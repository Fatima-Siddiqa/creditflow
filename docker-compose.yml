services:
  postgres:
    image: postgres:16
    container_name: creditflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditflow}
      POSTGRES_DB: ${POSTGRES_DB:-creditflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [creditflow-net]

  redis:
    image: redis:7-alpine
    container_name: creditflow-redis
    restart: unless-stopped
    # Logical DB index scheme (see docs/CONVENTIONS.md):
    # 0 = gateway rate-limit / webhook-dedup
    # 1 = auth jti store
    # 2 = Celery broker/backend (scheduler-service)
    # 3 = SSE pub/sub (ai-generation-service <-> gateway)
    # 4 = usage counters (usage-service)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [creditflow-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: creditflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [creditflow-net]

  mongodb:
    image: mongo:7
    container_name: creditflow-mongodb
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [creditflow-net]

  auth-service:
    build: ./services/auth-service
    container_name: creditflow-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: auth
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]
  user-service:
    build: ./services/user-service
    container_name: creditflow-user-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: tenant
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8000
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]
  billing-service:
    build: ./services/billing-service
    container_name: creditflow-billing-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: billing
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO}
      STRIPE_PRICE_ID_TEAM: ${STRIPE_PRICE_ID_TEAM}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]
  api-gateway:
    build: ./services/api-gateway
    container_name: creditflow-api-gateway
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      AUTH_JTI_REDIS_URL: redis://redis:6379/1
      SSE_REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      BILLING_SERVICE_URL: http://billing-service:8000
      CREDITS_SERVICE_URL: http://credits-service:8000
      USAGE_SERVICE_URL: http://usage-service:8000
      AI_GENERATION_SERVICE_URL: http://ai-generation-service:8000
      CONTENT_SERVICE_URL: http://content-service:8000
      SCHEDULER_SERVICE_URL: http://scheduler-service:8000
      SOCIAL_PUBLISHING_SERVICE_URL: http://social-publishing-service:8000
      SCRAPER_SERVICE_URL: http://scraper-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      ADMIN_SERVICE_URL: http://admin-service:8000
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      LINKEDIN_WEBHOOK_SECRET: ${LINKEDIN_WEBHOOK_SECRET}
      OPENROUTER_WEBHOOK_SECRET: ${OPENROUTER_WEBHOOK_SECRET}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  credits-service:
    build: ./services/credits-service
    container_name: creditflow-credits-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: credits
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  usage-service:
    build: ./services/usage-service
    container_name: creditflow-usage-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: usage
      REDIS_URL: redis://redis:6379/1
      USAGE_REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  ai-generation-service:
    build: ./services/ai-generation-service
    container_name: creditflow-ai-generation-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: ai
      REDIS_URL: redis://redis:6379/1
      SSE_REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      USAGE_SERVICE_URL: http://usage-service:8000
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  content-service:
    build: ./services/content-service
    container_name: creditflow-content-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: content
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
    volumes:
      - ./keys:/app/keys:ro
      - content_uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  scheduler-service:
    build: ./services/scheduler-service
    container_name: creditflow-scheduler-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: scheduler
      REDIS_URL: redis://redis:6379/1
      CELERY_REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      CONTENT_SERVICE_URL: http://content-service:8000
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [creditflow-net]

  scheduler-worker:
    build: ./services/scheduler-service
    container_name: creditflow-scheduler-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --beat --loglevel=info -c 1
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@postgres:5432/creditflow
      DB_SCHEMA: scheduler
      REDIS_URL: redis://redis:6379/1
      CELERY_REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      CONTENT_SERVICE_URL: http://content-service:8000
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [creditflow-net]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     rabbitmq: { condition: service_healthy }

networks:
  creditflow-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  content_uploads:
  rabbitmqdata:
  mongodata: